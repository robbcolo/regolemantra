<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@500;700&display=swap');

:root{
  --pitch:#0B2545;
  --pitch-dark:#071A33;
  --pitch-light:#13315C;
  --grass:#2D9D6F;
  --grass-light:#8FDCB6;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);

  color:var(--ink);

p{line-height:1.55;}
.muted{color:var(--muted);font-size:14px;}

.topbar{

.topbar::after{

  border-radius:50%; border:2px solid rgba(247,247,242,.10);
}
.topbar::before{

}
.topbar h1{font-size:24px; color:var(--chalk); margin-bottom:2px; position:relative; z-index:1;}
.topbar .kicker{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--coral); text-transform:uppercase; position:relative; z-index:1;}

.app-toast{

<script>
(function(){
"use strict";

/* ---------------------------------------------------------
   STORAGE LAYER — su Firestore: partecipanti e admin vedono
   gli stessi dati della lega tramite lo stesso database.
--------------------------------------------------------- */
async function storeGet(key, fallback){
  try{
    const doc = await db.collection('app_data').doc(key).get();
    if(!doc.exists) return fallback;
    const data = doc.data();
    return data && data.value !== undefined ? JSON.parse(data.value) : fallback;
  }catch(e){ console.error('firestore get failed', key, e); return fallback; }
}
async function storeSet(key, value){
  try{
    await db.collection('app_data').doc(key).set({ value: JSON.stringify(value) });
    return true;
  }catch(e){ console.error('firestore set failed', key, e); return false; }
}

const getTeams = () => storeGet('teams', []);
const saveTeams = (t) => storeSet('teams', t);
const getQuestions = () => storeGet('questions', []);
const saveQuestions = (q) => storeSet('questions', q);
const getConfig = () => storeGet('config', {
  adminPassword: 'Rob051196', scadenza: null, votazioneChiusa: false, bannerImage: null, biometricCredId: null,
});
const saveConfig = (c) => storeSet('config', c);
const getVotesForTeam = (teamId) => storeGet('votes:' + teamId, {});
const saveVotesForTeam = (teamId, v) => storeSet('votes:' + teamId, v);

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ---------------------------------------------------------
   TOAST + CONFERME PERSONALIZZATE
   (i dialog nativi alert/confirm possono restare bloccati
   in silenzio dentro l'iframe sandboxato dell'artifact)
--------------------------------------------------------- */
function showToast(msg, isError){
  let toast = document.getElementById('app-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.className = 'app-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.className = 'app-toast ' + (isError ? 'err' : 'ok');
  toast.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.display = 'none'; }, 3800);
}

function customConfirm(message){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn btn-outline" id="confirm-cancel" style="width:auto;">Annulla</button>
          <button class="btn btn-danger" id="confirm-ok" style="width:auto;">Conferma</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#confirm-ok').onclick = () => { document.body.removeChild(overlay); resolve(true); };
    overlay.querySelector('#confirm-cancel').onclick = () => { document.body.removeChild(overlay); resolve(false); };
  });
}

/* ---------------------------------------------------------
   WEBAUTHN — Face ID / Touch ID per l'admin (best-effort:
   l'ambiente sandboxato dell'artifact potrebbe non permetterlo;
   se non disponibile i pulsanti restano semplicemente nascosti
   e la password funziona comunque sempre come prima).
--------------------------------------------------------- */
function bufToB64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
async function biometricAvailable(){
  try{
    if(!window.PublicKeyCredential) return false;
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch(e){ return false; }
}
async function registerBiometric(){
  try{
    const ok = await biometricAvailable();
    if(!ok){ showToast('Face ID / Touch ID non disponibile su questo browser o dispositivo.', true); return; }
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'Tabellone Regole' },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'admin', displayName: 'Admin' },
        pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
      }
    });
    const cfg = await getConfig();
    cfg.biometricCredId = bufToB64(cred.rawId);
    const okSave = await saveConfig(cfg);
    if(!okSave){ showToast('Errore nel salvataggio. Riprova.', true); return; }
    showToast('Face ID / Touch ID configurato su questo dispositivo.');
    screenAdminDash();
  }catch(e){
    showToast('Configurazione annullata o non riuscita.', true);
  }
}
async function removeBiometric(){
  const cfg = await getConfig();
  cfg.biometricCredId = null;
  await saveConfig(cfg);
  showToast('Face ID / Touch ID disattivato su questo dispositivo.');
  screenAdminDash();
}
async function loginWithBiometric(){
  try{
    const cfg = await getConfig();
    if(!cfg.biometricCredId){ showToast('Face ID / Touch ID non ancora configurato.', true); return; }
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: b64ToBuf(cfg.biometricCredId), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000,
      }
    });
    if(assertion){ state.adminAuthed = true; setView('a-dash'); }
  }catch(e){
    showToast('Autenticazione biometrica annullata o non riuscita. Usa la password.', true);
  }
}

/* Una risposta è "completa" solo se, quando attiva una sotto-domanda
   condizionata (es. "Se sì..."), anche quella è stata compilata. */
function isAnswerComplete(answer, q){
  if(!answer) return false;
  if(q.followUp && answer.valore === q.followUp.trigger){
    return q.followUp.tipo === 'scelta'
      ? !!answer.followUpValore
      : !!(answer.followUpValore && String(answer.followUpValore).trim());
  }
  return true;
}

/* Stato di chiusura della votazione: manuale (admin) oppure automatico
   quando tutte le domande OBBLIGATORIE attive hanno 9/9 risposte complete. */
async function computeClosure(){
  const [cfg, teams, questions] = await Promise.all([getConfig(), getTeams(), getQuestions()]);
  const mandatory = questions.filter(q => q.attiva && q.obbligatoria !== false);
  const allVotes = teams.length ? await Promise.all(teams.map(t => getVotesForTeam(t.id))) : [];
  let autoComplete = teams.length > 0 && mandatory.length > 0;
  if(autoComplete){
    outer:
    for(const q of mandatory){
      for(const v of allVotes){
        if(!isAnswerComplete(v[q.id], q)){ autoComplete = false; break outer; }
      }
    }
  }
  const manual = !!cfg.votazioneChiusa;
  return { closed: manual || autoComplete, manual, autoComplete, cfg, teams, questions, allVotes };
}

/* ---------------------------------------------------------
   STATO (solo in memoria — niente localStorage/sessionStorage)
--------------------------------------------------------- */
let state = {
  view: 'loading',
  team: null,
  adminAuthed: false,
  adminTab: 'domande',
  editingQid: null,
  err: null,
};

const app = document.getElementById('app');

function setView(v, extra){
  state.view = v;
  state.err = null;
  if(extra) Object.assign(state, extra);
  render();
}

async function boot(){
  setView('home');
}

    </main>

/* ---------------------------------------------------------
   PARTECIPANTE — LOGIN
--------------------------------------------------------- */
async function screenParticipantLogin(){
  const [teams, cfg] = await Promise.all([getTeams(), getConfig()]);
  const banner = cfg.bannerImage ? `<img src="${cfg.bannerImage}" style="width:100%;display:block;max-height:220px;object-fit:cover;">` : '';
  app.innerHTML = `
    ${banner}
    ${topbar('Accesso Partecipante', 'Chi sei?', null, true, 'go-home')}
    <main>
      ${state.err ? `<div class="error-box">${state.err}</div>` : ''}
      ${teams.length === 0 ? `
        <div class="card"><p class="muted">L'admin non ha ancora configurato le squadre. Riprova più tardi.</p></div>
      ` : `
        <div class="card">
          <div class="field">
            <label>La tua squadra</label>
            <select id="team-select">
              <option value="">— seleziona —</option>
              ${teams.map(t => `<option value="${t.id}">${escapeHtml(t.nome)}</option>`).join('')}

/* ---------------------------------------------------------
   PARTECIPANTE — VOTO (modificabile finché la votazione è aperta)
--------------------------------------------------------- */
async function screenParticipantVote(){
  const [questions, myVotes, closureInfo] = await Promise.all([
    getQuestions(), getVotesForTeam(state.team.id), computeClosure()
  ]);
  const active = questions.filter(q => q.attiva).sort((a,b) => a.ordine - b.ordine);
  const mandatoryActive = active.filter(q => q.obbligatoria !== false);
  const doneTotal = active.filter(q => isAnswerComplete(myVotes[q.id], q)).length;
  const doneMandatory = mandatoryActive.filter(q => isAnswerComplete(myVotes[q.id], q)).length;
  const closed = closureInfo.closed;
  const banner = closureInfo.cfg.bannerImage ? `<img src="${closureInfo.cfg.bannerImage}" style="width:100%;display:block;max-height:220px;object-fit:cover;">` : '';

  app.innerHTML = `
    ${banner}
    ${topbar('Squadra: ' + escapeHtml(state.team.nome), 'Vota le domande', null, true, 'go-home')}
    <main>
      ${closed ? `<div class="info-box">🔒 Votazione chiusa${closureInfo.manual ? " dall'admin" : ' — tutte le domande obbligatorie hanno raggiunto 9/9'}. Le risposte qui sotto sono definitive.</div>` : ''}
      ${active.length === 0 ? `
        <div class="card"><p class="muted">Nessuna domanda attiva al momento. Torna più tardi.</p></div>
      ` : `
        <div class="card">
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${mandatoryActive.length ? Math.round(doneMandatory/mandatoryActive.length*100) : 0}%"></div></div>
            <span class="score-badge mono">${doneMandatory}/${mandatoryActive.length} obbligatorie</span>
          </div>
          <p class="muted" style="margin:8px 0 0;">${doneTotal}/${active.length} risposte totali date</p>
          ${!closed ? '<p class="muted" style="margin:6px 0 0;">Puoi cambiare le tue risposte finché la votazione resta aperta.</p>' : ''}
        </div>
        ${active.map((q, i) => renderQuestionCard(q, i, myVotes[q.id], closed)).join('')}
      `}
    </main>
  `;
}

function renderQuestionCard(q, i, myAnswer, closed){
  const tagText = q.obbligatoria !== false ? 'Obbligatoria' : 'Opzionale';
  let mainInput;
  if(q.tipo === 'scelta'){
    mainInput = `
      <div class="opts">
        ${q.opzioni.map(o => `
          <label class="opt-row">
            <input type="radio" name="q-${q.id}" value="${escapeHtml(o)}" ${myAnswer && myAnswer.valore === o ? 'checked' : ''} ${closed ? 'disabled' : ''}>
            <span>${escapeHtml(o)}</span>
          </label>
        `).join('')}
      </div>
    `;
  } else {
    mainInput = `
      <div class="field" style="margin-bottom:10px;">
        <textarea id="free-${q.id}" placeholder="Scrivi la tua risposta…" ${closed ? 'disabled' : ''}>${myAnswer ? escapeHtml(myAnswer.valore) : ''}</textarea>
      </div>
    `;
  }

  let fuBlock = '';
  if(q.followUp){
    const show = myAnswer && myAnswer.valore === q.followUp.trigger;
    fuBlock = `
      <div id="fu-wrap-${q.id}" data-trigger="${escapeHtml(q.followUp.trigger)}" style="${show ? '' : 'display:none;'} margin-top:10px; border-left:3px solid var(--grass); padding-left:12px;">
        <div class="q-text" style="font-size:14px;">${escapeHtml(q.followUp.testo)}</div>
        ${q.followUp.tipo === 'scelta' ? `
          <div class="opts">
            ${q.followUp.opzioni.map(o => `
              <label class="opt-row">
                <input type="radio" name="fuq-${q.id}" value="${escapeHtml(o)}" ${myAnswer && myAnswer.followUpValore === o ? 'checked' : ''} ${closed ? 'disabled' : ''}>
                <span>${escapeHtml(o)}</span>
              </label>
            `).join('')}
          </div>
        ` : `
          <textarea id="fu-free-${q.id}" placeholder="Scrivi qui…" ${closed ? 'disabled' : ''}>${myAnswer && myAnswer.followUpValore ? escapeHtml(myAnswer.followUpValore) : ''}</textarea>
        `}
      </div>
    `;
  }

  const savedNote = myAnswer
    ? `<span class="locked-tag">${closed ? '🔒 Risposta finale' : '✓ Salvata — modificabile'}</span>`
    : '';

  return `
    <div class="q-card">
      <div class="q-index">Domanda ${i+1} · ${tagText}</div>
      <div class="q-text">${escapeHtml(q.testo)}</div>
      ${mainInput}
      ${fuBlock}
      <div style="margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        ${!closed ? `<button class="btn btn-primary" style="width:auto;" data-action="submit-vote" data-qid="${q.id}" data-type="${q.tipo}">${myAnswer ? 'Aggiorna risposta' : 'Invia risposta'}</button>` : ''}
        ${savedNote}
      </div>
    </div>
  `;
}

let submitting = false;
async function submitVote(qid, type){
  if(submitting) return;

  const closureInfo = await computeClosure();
  if(closureInfo.closed){
    showToast('La votazione è chiusa: non è più possibile modificare le risposte.', true);
    return screenParticipantVote();
  }
  const q = closureInfo.questions.find(x => x.id === qid);
  if(!q) return;

  let value, followUpValore;
  if(type === 'scelta'){
    const sel = document.querySelector(`input[name="q-${qid}"]:checked`);
    if(!sel){ showToast('Seleziona un\'opzione prima di inviare.', true); return; }
    value = sel.value;
  } else {
    const txt = document.getElementById('free-' + qid).value.trim();
    if(!txt){ showToast('Scrivi una risposta prima di inviare.', true); return; }
    value = txt;
  }

  if(q.followUp && value === q.followUp.trigger){
    if(q.followUp.tipo === 'scelta'){
      const fsel = document.querySelector(`input[name="fuq-${qid}"]:checked`);
      if(!fsel){ showToast('Completa anche "' + q.followUp.testo + '" prima di inviare.', true); return; }
      followUpValore = fsel.value;
    } else {
      const ftxt = document.getElementById('fu-free-' + qid).value.trim();
      if(!ftxt){ showToast('Completa anche "' + q.followUp.testo + '" prima di inviare.', true); return; }
      followUpValore = ftxt;
    }
  }

  submitting = true;
  const votes = await getVotesForTeam(state.team.id);
  votes[qid] = { valore: value, followUpValore: followUpValore, timestamp: Date.now() };
  const ok = await saveVotesForTeam(state.team.id, votes);
  submitting = false;
  if(!ok){ showToast('Errore di salvataggio, riprova.', true); return; }
  showToast('Risposta salvata.');
  screenParticipantVote();
}

/* ---- BACKUP: esporta/importa squadre + domande + banner (mai i voti) ---- */
async function exportBackup(){
  const [teams, questions, cfg] = await Promise.all([getTeams(), getQuestions(), getConfig()]);
  const payload = { exportedAt: new Date().toISOString(), teams, questions, scadenza: cfg.scadenza || null, bannerImage: cfg.bannerImage || null };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tabellone-regole-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importBackup(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data.teams) || !Array.isArray(data.questions)){
      showToast('File di backup non valido.', true);
      return;
    }
    if(!(await customConfirm('Questo sostituirà le squadre e le domande attualmente salvate con quelle del backup. I voti già espressi non vengono toccati. Continuare?'))) return;
    await saveTeams(data.teams);
    await saveQuestions(data.questions);
    const cfg = await getConfig();
    if(data.scadenza !== undefined) cfg.scadenza = data.scadenza;
    if(data.bannerImage !== undefined) cfg.bannerImage = data.bannerImage;
    await saveConfig(cfg);
    showToast('Backup importato con successo.');
    screenAdminDash();
  }catch(e){
    showToast('Errore nella lettura del file di backup.', true);
  }
}

function readQuestionForm(){
  const text = document.getElementById('new-q-text').value.trim();
  const type = document.getElementById('new-q-type').value;
  const mandatory = document.getElementById('new-q-mandatory').checked;
  if(!text){ showToast('Scrivi il testo della domanda.', true); return null; }
  let opzioni = [];
  if(type === 'scelta'){
    opzioni = optionInputsIn('new-q-options').map(i => i.value.trim()).filter(Boolean);
    if(opzioni.length < 2){ showToast('Servono almeno 2 opzioni.', true); return null; }
  }
  let followUp = null;
  const fuToggle = document.getElementById('new-q-followup-toggle');
  if(type === 'scelta' && fuToggle && fuToggle.checked){
    const trigger = document.getElementById('fu-trigger').value.trim();
    const fuText = document.getElementById('fu-text').value.trim();
    const fuType = document.getElementById('fu-type').value;
    if(!trigger || !opzioni.includes(trigger)){ showToast('Il valore che attiva la sotto-domanda deve corrispondere esattamente a una delle opzioni sopra (es. "Sì").', true); return null; }
    if(!fuText){ showToast('Scrivi il testo della sotto-domanda condizionata.', true); return null; }
    let fuOpzioni = [];
    if(fuType === 'scelta'){
      fuOpzioni = optionInputsIn('fu-options').map(i => i.value.trim()).filter(Boolean);
      if(fuOpzioni.length < 2){ showToast('Servono almeno 2 opzioni per la sotto-domanda.', true); return null; }
    }
    followUp = { trigger, testo: fuText, tipo: fuType, opzioni: fuOpzioni };
  }
  return { testo: text, tipo: type, opzioni, obbligatoria: mandatory, followUp };
}

async function addQuestion(){
  const data = readQuestionForm();
  if(!data) return;
  const questions = await getQuestions();
  const maxOrd = questions.reduce((m,q) => Math.max(m, q.ordine), 0);
  questions.push({ id: uid('q'), ordine: maxOrd + 1, attiva: true, ...data });
  await saveQuestions(questions);
  showToast('Domanda aggiunta.');
  screenAdminDash();
}

async function toggleQuestion(qid){

async function deleteQuestion(qid){
  if(!(await customConfirm('Eliminare questa domanda? Eventuali voti già espressi resteranno salvati ma non più visibili in lista.'))) return;
  let questions = await getQuestions();
  questions = questions.filter(x => x.id !== qid);
  await saveQuestions(questions);
  showToast('Domanda eliminata.');
  screenAdminDash();
}

async function moveQuestion(qid, dir){
  const questions = (await getQuestions()).sort((a,b) => a.ordine - b.ordine);
  const idx = questions.findIndex(q => q.id === qid);
  const swapIdx = idx + Number(dir);
  if(swapIdx < 0 || swapIdx >= questions.length) return;
  const tmp = questions[idx].ordine;
  questions[idx].ordine = questions[swapIdx].ordine;
  questions[swapIdx].ordine = tmp;
  await saveQuestions(questions);
  screenAdminDash();
}

async function addTeam(){
  const name = document.getElementById('new-team-name').value.trim();
  const pin = document.getElementById('new-team-pin').value.trim();
  if(!name || !pin){ showToast('Inserisci nome squadra e PIN.', true); return; }
  const teams = await getTeams();
  teams.push({ id: uid('t'), nome: name, pin });
  await saveTeams(teams);
  showToast('Squadra aggiunta.');
  screenAdminDash();
}

async function deleteTeam(tid){
  if(!(await customConfirm('Eliminare questa squadra? I voti già espressi restano salvati ma la squadra non potrà più accedere.'))) return;
  let teams = await getTeams();
  teams = teams.filter(t => t.id !== tid);
  await saveTeams(teams);
  showToast('Squadra eliminata.');
  screenAdminDash();
}

/* ---- TAB: STATO VOTO ---- */
async function tabStato(){
  const closureInfo = await computeClosure();
  const { teams, questions, allVotes, cfg } = closureInfo;
  const active = questions.filter(q => q.attiva);
  const mandatory = active.filter(q => q.obbligatoria !== false);

  let completeCount = 0;
  const jerseys = teams.map((t, i) => {
    const v = allVotes[i];
    const doneMandatory = mandatory.filter(q => isAnswerComplete(v[q.id], q)).length;
    const doneTotal = active.filter(q => isAnswerComplete(v[q.id], q)).length;
    const isComplete = mandatory.length > 0 && doneMandatory === mandatory.length;
    if(isComplete) completeCount++;
    return `
      <div class="jersey ${isComplete ? 'done' : ''}">
        <div class="num">${isComplete ? '✓' : (i+1)}</div>
        <div class="name">${escapeHtml(t.nome)}</div>
        <div class="stat">${doneTotal}/${active.length}</div>
      </div>
    `;
  }).join('');

  const missing = teams.filter((t,i) => {
    const v = allVotes[i];
    const doneMandatory = mandatory.filter(q => isAnswerComplete(v[q.id], q)).length;
    return !(mandatory.length > 0 && doneMandatory === mandatory.length);
  });

  const statusHtml = closureInfo.closed
    ? `<div class="info-box">🔒 Votazione chiusa ${closureInfo.manual ? '(chiusa manualmente)' : '(tutte le domande obbligatorie hanno raggiunto 9/9)'}</div>
       ${closureInfo.manual ? `<button class="btn btn-outline btn-sm no-print" data-action="reopen-voting">Riapri votazione</button>` : ''}`
    : `<div class="card" style="padding:14px;">
        <p class="muted" style="margin:0 0 10px;">Votazione aperta — i partecipanti possono ancora rispondere o cambiare le risposte.</p>
        <button class="btn btn-danger btn-sm" data-action="close-voting">Chiudi votazione ora</button>
       </div>`;

  return `
    ${statusHtml}
    <div class="card">
      <h3 style="font-size:15px;">Chi ha risposto alle domande obbligatorie</h3>
      <p class="muted" style="margin-top:-4px;">${completeCount}/${teams.length} squadre complete · nessun contenuto dei voti è mostrato qui</p>
      <div class="lineup" style="margin-top:12px;">${jerseys || '<p class="muted">Aggiungi prima le squadre.</p>'}</div>
    </div>
    ${missing.length > 0 && teams.length > 0 ? `
      <div class="card">
        <h3 style="font-size:15px;">Da sollecitare</h3>
        <p class="muted" style="margin-top:-4px;">${missing.map(t => escapeHtml(t.nome)).join(', ')}</p>
      </div>
    ` : ''}
    <div class="card">
      <h3 style="font-size:15px;">Scadenza (opzionale)</h3>
      ${cfg.scadenza ? `<p class="muted">Scadenza votazione: <strong>${formatDate(cfg.scadenza)}</strong></p>` : ''}
      <div class="field"><label>Data di scadenza</label><input type="date" id="scadenza-input" value="${cfg.scadenza || ''}"></div>
      <button class="btn btn-outline" data-action="save-scadenza">Salva scadenza</button>
    </div>
  `;
}

async function closeVoting(){
  if(!(await customConfirm('Chiudere la votazione ora? Nessuno potrà più rispondere o modificare le risposte, e i risultati diventeranno visibili.'))) return;
  const cfg = await getConfig();
  cfg.votazioneChiusa = true;
  await saveConfig(cfg);
  screenAdminDash();
}

async function reopenVoting(){
  if(!(await customConfirm('Riaprire la votazione? I partecipanti potranno di nuovo rispondere o modificare le risposte, e i risultati torneranno nascosti (a meno che le domande obbligatorie non siano già tutte a 9/9).'))) return;
  const cfg = await getConfig();
  cfg.votazioneChiusa = false;
  await saveConfig(cfg);
  screenAdminDash();
}

async function saveScadenza(){
  const val = document.getElementById('scadenza-input').value;
  const cfg = await getConfig();
  cfg.scadenza = val || null;
  await saveConfig(cfg);
  showToast('Scadenza salvata.');
  screenAdminDash();
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'long', year:'numeric' });
}

/* ---- TAB: RISULTATI ---- */
const PIE_COLORS = ['#2D9D6F','#FF6B4A','#4C6FFF','#F4A261','#9D4EDD','#E63965','#2A9D8F','#FFB703'];

async function tabRisultati(){
  const closureInfo = await computeClosure();
  const { teams, questions, allVotes } = closureInfo;
  const active = questions.filter(q => q.attiva).sort((a,b) => a.ordine - b.ordine);
  const totalTeams = teams.length;

  if(totalTeams === 0 || active.length === 0){
    return `<div class="card"><p class="muted">Configura squadre e domande per iniziare a raccogliere risultati.</p></div>`;
  }

  if(!closureInfo.closed){
    return `<div class="waiting-box">🔒 I risultati si sbloccano quando la votazione viene chiusa — manualmente dall'admin (tab "Stato Voto"), oppure automaticamente quando tutte le domande obbligatorie raggiungono 9/9.</div>`;
  }

  const blocks = active.map((q, qi) => {
    const answers = allVotes.map(v => v[q.id]).filter(Boolean);
    const respondersCount = answers.length;
    let mainBlock;

    if(q.tipo === 'scelta'){
      const counts = {};
      q.opzioni.forEach(o => counts[o] = 0);
      answers.forEach(a => { counts[a.valore] = (counts[a.valore]||0) + 1; });
      const svg = buildPieSVG(q.opzioni.map((o,i) => ({ label:o, value:counts[o]||0, color:PIE_COLORS[i % PIE_COLORS.length] })));
      const legend = q.opzioni.map((o,i) => `
        <div class="legend-row">
          <span class="legend-dot" style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></span>
          <span>${escapeHtml(o)}</span>
          <span class="legend-val mono">${counts[o]||0}${respondersCount ? ` · ${Math.round((counts[o]||0)/respondersCount*100)}%` : ''}</span>
        </div>
      `).join('');
      mainBlock = `<div class="pie-flex">${svg}<div class="legend">${legend}</div></div>`;
    } else {
      const groups = {};
      answers.forEach(a => { const key = a.valore.trim(); groups[key] = (groups[key]||0) + 1; });
      const rows = Object.entries(groups).sort((a,b) => b[1]-a[1]).map(([txt,c]) => `
        <div class="freetext-item"><span>${escapeHtml(txt)}</span><span class="mono">×${c}</span></div>
      `).join('');
      mainBlock = rows || `<p class="muted">Nessuna risposta.</p>`;
    }

    let fuBlockHtml = '';
    if(q.followUp){
      const triggered = answers.filter(a => a.valore === q.followUp.trigger);
      if(triggered.length > 0){
        if(q.followUp.tipo === 'scelta'){
          const fcounts = {};
          q.followUp.opzioni.forEach(o => fcounts[o] = 0);
          triggered.forEach(a => { if(a.followUpValore) fcounts[a.followUpValore] = (fcounts[a.followUpValore]||0) + 1; });
          const fsvg = buildPieSVG(q.followUp.opzioni.map((o,i) => ({ label:o, value:fcounts[o]||0, color:PIE_COLORS[i % PIE_COLORS.length] })));
          const flegend = q.followUp.opzioni.map((o,i) => `
            <div class="legend-row"><span class="legend-dot" style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></span><span>${escapeHtml(o)}</span><span class="legend-val mono">${fcounts[o]||0}</span></div>
          `).join('');
          fuBlockHtml = `<div style="margin-top:14px; border-top:1px dashed var(--line); padding-top:12px;">
            <div class="item-meta mono">Sotto-domanda: ${escapeHtml(q.followUp.testo)} (${triggered.length} risposte)</div>
            <div class="pie-flex" style="margin-top:8px;">${fsvg}<div class="legend">${flegend}</div></div>
          </div>`;
        } else {
          const frows = triggered.filter(a => a.followUpValore).map(a => `<div class="freetext-item"><span>${escapeHtml(a.followUpValore)}</span></div>`).join('');
          fuBlockHtml = `<div style="margin-top:14px; border-top:1px dashed var(--line); padding-top:12px;">
            <div class="item-meta mono">Sotto-domanda: ${escapeHtml(q.followUp.testo)} (${triggered.length} risposte)</div>
            ${frows}
          </div>`;
        }
      }
    }

    return `
      <div class="pie-block">
        <div class="item-meta mono">Domanda ${qi+1} · ${respondersCount}/${totalTeams} risposte${q.obbligatoria === false ? ' · opzionale' : ''}</div>
        <div class="item-title" style="margin-bottom:10px;">${escapeHtml(q.testo)}</div>
        ${mainBlock}
        ${fuBlockHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="no-print" style="display:flex; gap:10px;">
      <button class="btn btn-outline" data-action="refresh-results">↻ Aggiorna</button>
      <button class="btn btn-coral" data-action="print-results">🖨 Stampa / Esporta PDF</button>
    </div>
    ${blocks}
  `;
}

function buildPieSVG(data){
  const total = data.reduce((s,d) => s+d.value, 0);
  const cx=70, cy=70, r=65;
  let angle = 0;
  let paths = '';
  if(total === 0){
    paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#E7EBF2"></circle>`;
  } else {
    data.forEach(d => {
      if(d.value === 0) return;
      const slice = d.value/total*360;
      const start = angle, end = angle + slice;
      paths += `<path d="${describeArc(cx,cy,r,start,end)}" fill="${d.color}"></path>`;
      angle = end;
    });
  }
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;">${paths}<circle cx="${cx}" cy="${cy}" r="28" fill="white"></circle></svg>`;
}
function polarToCartesian(cx,cy,r,angleDeg){
  const a = (angleDeg-90) * Math.PI/180;
  return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToCartesian(cx,cy,r,endAngle);
  const end = polarToCartesian(cx,cy,r,startAngle);
  const largeArc = (endAngle-startAngle) <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}

function onBannerFileChange(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const cfg = await getConfig();
      cfg.bannerImage = dataUrl;
      const ok = await saveConfig(cfg);
      if(!ok){ showToast('Errore nel salvataggio dell\'immagine (potrebbe essere troppo grande — prova un file più piccolo).', true); return; }
      showToast('Banner aggiornato.');
      screenAdminDash();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function removeBanner(){
  const cfg = await getConfig();
  cfg.bannerImage = null;
  await saveConfig(cfg);
  showToast('Banner rimosso.');
  screenAdminDash();
}

async function changePassword(){
  const pw = document.getElementById('new-admin-pw').value;
  const pw2 = document.getElementById('new-admin-pw2').value;
  if(!pw || pw.length < 4){ showToast('Usa almeno 4 caratteri.', true); return; }
  if(pw !== pw2){ showToast('Le due password non coincidono.', true); return; }
  const cfg = await getConfig();
  cfg.adminPassword = pw;
  const ok = await saveConfig(cfg);
  if(!ok){ showToast('Errore nel salvataggio.', true); return; }
  showToast('Password aggiornata.');
  screenAdminDash();
}

function render(){
  if(state.view === 'home') return screenHome();
  if(state.view === 'p-login') return screenParticipantLogin();
  if(state.view === 'p-vote') return screenParticipantVote();
  if(state.view === 'a-login') return screenAdminLogin();

    if(!state.adminAuthed) return screenAdminLogin();
    return screenAdminDash();
  }
}

  if(!btn) return;
  const action = btn.getAttribute('data-action');
  switch(action){
    case 'go-home': state.team=null; state.adminAuthed=false; state.editingQid=null; setView('home'); break;
    case 'go-p-login': setView('p-login'); break;
    case 'go-a-login': setView('a-login'); break;
    case 'do-p-login': doParticipantLogin(); break;
    case 'do-a-login': doAdminLogin(); break;
    case 'login-biometric': loginWithBiometric(); break;
    case 'submit-vote': submitVote(btn.getAttribute('data-qid'), btn.getAttribute('data-type')); break;
    case 'set-tab': state.adminTab = btn.getAttribute('data-tab'); state.editingQid=null; screenAdminDash(); break;
    case 'add-opt-field': addOptionFieldIn(btn.getAttribute('data-target')); break;
    case 'add-question': addQuestion(); break;
    case 'edit-q': editQuestion(btn.getAttribute('data-qid')); break;
    case 'save-question': saveQuestionEdit(btn.getAttribute('data-qid')); break;
    case 'cancel-edit-q': cancelEditQuestion(); break;
    case 'toggle-q': toggleQuestion(btn.getAttribute('data-qid')); break;
    case 'delete-q': deleteQuestion(btn.getAttribute('data-qid')); break;
    case 'move-q': moveQuestion(btn.getAttribute('data-qid'), btn.getAttribute('data-dir')); break;
    case 'add-team': addTeam(); break;
    case 'delete-team': deleteTeam(btn.getAttribute('data-tid')); break;
    case 'save-scadenza': saveScadenza(); break;
    case 'close-voting': closeVoting(); break;
    case 'reopen-voting': reopenVoting(); break;
    case 'remove-banner': removeBanner(); break;
    case 'change-password': changePassword(); break;
    case 'register-biometric': registerBiometric(); break;
    case 'remove-biometric': removeBiometric(); break;
    case 'refresh-results': screenAdminDash(); break;
    case 'print-results': window.print(); break;
    case 'export-backup': exportBackup(); break;
  }
});
app.addEventListener('change', (e) => {
  if(e.target.id === 'new-q-type') onQTypeChange();
  else if(e.target.id === 'new-q-followup-toggle') onFollowupToggle();
  else if(e.target.id === 'fu-type') onFuTypeChange();
  else if(e.target.id === 'import-file-input') importBackup(e.target.files[0]);
  else if(e.target.id === 'banner-file-input') onBannerFileChange(e.target.files[0]);
  else if(e.target.name && e.target.name.startsWith('q-')){
    const qid = e.target.name.slice(2);
    const wrap = document.getElementById('fu-wrap-' + qid);
    if(wrap){
      const trigger = wrap.getAttribute('data-trigger');
      wrap.style.display = (e.target.value === trigger) ? 'block' : 'none';
    }
  }
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
